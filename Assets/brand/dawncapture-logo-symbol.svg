<?xml version="1.0" encoding="UTF-8"?>
<!-- App symbol: dawn arc + horizon + REC dot (no capture frame). -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 100 100"
     width="1024"
     height="1024"
     version="1.1">
  <title>DawnCapture App Symbol</title>
  <defs>
    <style type="text/css"><![CDATA[
      .tile-fill { fill: #FFFFFF; }
      .horizon { fill: none; stroke: #8A9199; stroke-width: 3.5; stroke-linecap: butt; }
      .dawn-arc { fill: none; stroke: #D85B42; stroke-width: 8; stroke-linecap: butt; stroke-linejoin: miter; }
      .record-dot { fill: #D85B42; }
    ]]></style>
  </defs>
  <rect class="tile-fill" x="0" y="0" width="100" height="100" rx="14" ry="14"/>
  <path class="dawn-arc" d="M 12 66 A 38 38 0 0 1 88 66"/>
  <path class="horizon" d="M 8 66 H 92"/>
  <circle class="record-dot" cx="68" cy="75" r="7.5"/>
</svg>
