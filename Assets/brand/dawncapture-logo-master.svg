<?xml version="1.0" encoding="UTF-8"?>
<!-- DawnCapture master logo - B05 Frame Dawn, sunrise arc on extended horizon. -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 100 100"
     width="1024"
     height="1024"
     version="1.1">
  <title>DawnCapture Logo - Frame Dawn (B05)</title>
  <desc>Butt-capped dawn arc; horizon slightly wider than arc span.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      .tile-fill { fill: #FFFFFF; }
      .frame-stroke { fill: none; stroke: #BDC2C8; stroke-width: 4; }
      .horizon { fill: none; stroke: #8A9199; stroke-width: 3.5; stroke-linecap: butt; }
      .dawn-arc { fill: none; stroke: #D85B42; stroke-width: 8; stroke-linecap: butt; stroke-linejoin: miter; }
      .record-dot { fill: #D85B42; }
    ]]></style>
  </defs>

  <g id="tile-plate">
    <rect class="tile-fill" x="0" y="0" width="100" height="100" rx="14" ry="14"/>
  </g>

  <g id="mark-frame-dawn">
    <rect class="frame-stroke" x="7" y="7" width="86" height="86" rx="12" ry="12"/>
    <path class="dawn-arc" d="M 14 68 A 36 36 0 0 1 86 68"/>
    <path class="horizon" d="M 10 68 H 90"/>
    <circle class="record-dot" cx="67" cy="74.5" r="6.5"/>
  </g>
</svg>
